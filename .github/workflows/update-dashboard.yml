name: Update dashboard data (Google Scholar edition)

on:
  schedule:
    # Every Monday at 05:00 UTC. A full run costs ~330 SerpAPI searches
    # (confirmed from real usage), and the Developer plan has 5,000/month —
    # weekly uses only ~27% of quota, leaving plenty of room for manual
    # ad-hoc runs. Adjust as needed: https://crontab.guru
    - cron: "0 5 * * 1"
  workflow_dispatch: {}   # lets you trigger a refresh manually from the Actions tab
  # No automatic "push" trigger — unlike the OpenAlex-based dashboard, every
  # run here costs real SerpAPI quota (300-400+ searches with precise-date
  # checks), so config/script changes don't auto-trigger a refresh. Use the
  # manual "Run workflow" button when you want one after editing config.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest publication data from Google Scholar
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated data if changed
        run: |
          git config user.name "ellis-dashboard-scholar-bot"
          git config user.email "actions@github.com"
          git add docs/data/publications.json docs/data/activities.json
          git diff --cached --quiet || git commit -m "chore: refresh publication data from Google Scholar"
          git push

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
